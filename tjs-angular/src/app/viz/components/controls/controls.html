<div class="parent">
    <table>
        <tr><th colspan="4">group: {{controlsService.groupName()}} </th></tr>
        <tr>
            <th>&nbsp;</th>
            <th>x/r</th>
            <th>y/g</th>
            <th>z/b</th>
        </tr>
        <tr>
            <td><div>rotation</div></td>
            <td>
                <input 
                    #xRotation 
                    type="number" 
                    (input)="setRotation(xRotation.value, 'x')"
                    [value]="controlsService.x()"
                >
            </td>
            <td>
                <input 
                    #yRotation 
                    type="number" 
                    (input)="setRotation(yRotation.value, 'y')"
                    [value]="controlsService.y()"
                >
            </td>
            <td>
                <input 
                    #zRotation 
                    type="number" 
                    (input)="setRotation(zRotation.value, 'z')"
                    [value]="controlsService.z()"
                >
            </td>
        </tr>
        <tr>
            <td>
                <div>
                    position
                </div>
            </td>
            <td>
                <input 
                    #xPosition 
                    type="number" 
                    (input)="setPosition(xPosition.value, 'x')"
                    [value]="controlsService.xPosition()"
                >
            </td>
            <td>
                <input 
                    #yPosition 
                    type="number" 
                    (input)="setPosition(yPosition.value, 'y')"
                    [value]="controlsService.yPosition()"
                >
            </td>
            <td>
                <input 
                    #zPosition 
                    type="number" 
                    (input)="setPosition(zPosition.value, 'z')"
                    [value]="controlsService.zPosition()"
                >
            </td>
        </tr>
        <tr>
            <td>
                <div>
                    color
                </div>
            </td>
            <td>
                <input 
                    #rColor 
                    type="number" 
                    (input)="setColor(rColor.value, 'r')"
                    [value]="controlsService.rColor()"
                > 
            </td>
            <td>
                <input 
                    #gColor 
                    type="number" 
                    (input)="setColor(gColor.value, 'g')"
                    [value]="controlsService.gColor()"
                >
            </td>
            <td>
                <input 
                    #bColor 
                    type="number" 
                    (input)="setColor(bColor.value, 'b')"
                    [value]="controlsService.bColor()"
                >
            </td>
        </tr>

        <tr>
            <td colspan="4">
                <label>Choose a mesh: </label>
                <select (change)="selectMesh($event)">
                    <option></option>
                    @for(meshOption of MeshClass.getList(); track meshOption) {
                        <option value="{{meshOption}}">{{meshOption}}</option>
                    }
                </select>
            </td>
        </tr>

        <tr>
            <td colspan="4">
                <label>Choose a material: </label>
                <select (change)="selectMaterial($event)">
                    <option></option>
                    @for(materialOption of MaterialClass.getList(); track materialOption) {
                        <option value="{{materialOption}}">{{materialOption}}</option>
                    }
                </select>
            </td>
        </tr>

        <tr>
            <td>
                <div>
                    e-color
                </div>
            </td>
            <td>
                <input 
                    #erColor 
                    type="number" 
                    (input)="setEColor(erColor.value, 'r')"
                    [value]="controlsService.erColor()"
                >
            </td>
            <td>
                <input 
                    #egColor 
                    type="number" 
                    (input)="setEColor(egColor.value, 'g')"
                    [value]="controlsService.egColor()"
                >
            </td>
            <td>
                <input 
                    #ebColor 
                    type="number" 
                    (input)="setEColor(ebColor.value, 'b')"
                    [value]="controlsService.ebColor()"
                >
            </td>
        </tr>
        <tr>
            <td>
                <div>
                    e-intensity
                </div>
            </td>
            <td colspan="3">
                <input 
                    #eIntensity 
                    class="colspan3"
                    type="number" 
                    (input)="setEIntensity(eIntensity.value)"
                    value="1"
                    step=".1"
                >
            </td>
        </tr>


    </table>



</div>
