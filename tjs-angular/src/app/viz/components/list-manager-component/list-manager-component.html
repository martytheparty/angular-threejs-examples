<table mat-table [dataSource]="controlsService.groups()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let group">
      @if(sceneService.selectedGroup === group) {
      <span>*</span> 
      }
      {{group.name}} </td>
    <td mat-footer-cell *matFooterCellDef>
      <div class="ff-wrapper">
      <button mat-icon-button (click)="importGroup()">
        <mat-icon>file_upload</mat-icon>
      </button>
        <mat-form-field class="small-field" appearance="outline">
             <input placeholder="add viz" matInput #groupName>
        </mat-form-field>
        @if(groupName.value.length > 0) {
        <button mat-button (click)="addGroup(groupName)">
          <mat-icon>add</mat-icon>
          Add Group
        </button>
        }
      </div>
    </td>
  </ng-container>
  <!-- Delete column -->
<ng-container matColumnDef="delete">
  <th mat-header-cell *matHeaderCellDef></th>

  <td mat-cell *matCellDef="let group">
    <button mat-icon-button (click)="$event.stopPropagation();deleteGroup(group)">
      <mat-icon>delete</mat-icon>
    </button>
    <button mat-icon-button (click)="$event.stopPropagation();exportGroup(group)">
      <mat-icon>file_download</mat-icon>
    </button>
  </td>

  <td mat-footer-cell *matFooterCellDef></td>
</ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr (click)="selectRow(row)" mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
</table>

<ng-template #toJson let-data>
  <mat-dialog-content class="json-content">
    <pre>{{data.json | json}}</pre>
  </mat-dialog-content>
</ng-template>

<ng-template #fromJson>
  <h2 mat-dialog-title>Import Group</h2>

  <mat-dialog-content>
    <textarea
      class="import-text"
      #jsonData
      placeholder="Paste Three.js JSON here">
    </textarea>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-icon-button
      (click)="addGroupFromJson(jsonData)"
      aria-label="Import group">
      <mat-icon>add</mat-icon>
    </button>

    <button
      mat-button
      mat-dialog-close>
      Cancel
    </button>
  </mat-dialog-actions>
</ng-template>
