<div class="parent">
    <table>
        <tr>
            <th>&nbsp;</th>
            <th>x</th>
            <th>y</th>
            <th>z</th>
        </tr>
        <tr [class.selected-attribute]="controlsService.selectedAttribute()=='rotation'">
            <td><div
                    (click)="setAttribute('rotation')"
                >rotation</div></td>
            <td>
                <div 
                    (click)="setControlSelected('x')"
                    [ngClass]="{'selected': controlsService.selected() === 'x'}"
                >{{controlsService.x()}}
                </div>
            </td>
            <td>
                <div
                    (click)="setControlSelected('y')"
                    [ngClass]="{'selected': controlsService.selected() === 'y'}"
                >{{controlsService.y()}}
                </div>
            </td>
            <td>
                <div
                    (click)="setControlSelected('z')"
                    [ngClass]="{'selected': controlsService.selected() === 'z'}"
                >{{controlsService.z()}}
                </div>
            </td>
        </tr>
        <tr [class.selected-attribute]="controlsService.selectedAttribute()=='position'">
            <td>
                <div 
                (click)="setAttribute('position')">
                    position
                </div>
            </td>
            <td>
                <div 
                    (click)="setControlPositionSelected('x')"
                    [ngClass]="{'selected': controlsService.selectedPosition() === 'x'}"
                >{{controlsService.xPosition()}}
                </div>
            </td>
            <td>
                <div
                    (click)="setControlPositionSelected('y')"
                    [ngClass]="{'selected': controlsService.selectedPosition() === 'y'}"
                >{{controlsService.yPosition()}}
                </div>
            </td>
            <td>
                <div
                    (click)="setControlPositionSelected('z')"
                    [ngClass]="{'selected': controlsService.selectedPosition() === 'z'}"
                >{{controlsService.zPosition()}}
                </div>
            </td>
        </tr>
        <tr>
            <th>&nbsp;</th>
            <th>r</th>
            <th>g</th>
            <th>b</th>
        </tr>
        <tr [class.selected-attribute]="controlsService.selectedAttribute()=='color'">
            <td>
                <div 
                (click)="setAttribute('color')">
                    color
                </div>
            </td>
            <td>
                <div 
                    (click)="setColorPositionSelected('r')"
                    [ngClass]="{'selected': controlsService.selectedColorPosition() === 'r'}"
                >{{controlsService.rColor()}}
                </div>
            </td>
            <td>
                <div 
                    (click)="setColorPositionSelected('g')"
                    [ngClass]="{'selected': controlsService.selectedColorPosition() === 'g'}"
                >{{controlsService.gColor()}}
                </div>
            </td>
            <td>
                <div 
                    (click)="setColorPositionSelected('b')"
                    [ngClass]="{'selected': controlsService.selectedColorPosition() === 'b'}"
                >{{controlsService.bColor()}}
                </div>
            </td>
        </tr>

        <tr>
            <td colspan="4">
                <label for="cars">Choose a mesh: </label>
                <select (change)="selectMesh($event)">
                    <option></option>
                    @for(meshOption of MeshClass.getList(); track meshOption) {
                        <option value="{{meshOption}}">{{meshOption}}</option>
                    }
                </select>
            </td>
        </tr>
    </table>



</div>
