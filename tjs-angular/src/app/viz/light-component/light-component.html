<div>
    <table>
        <tr>
            <th colspan="2">
                <div class="import-export">
                    scene import
                    <button class="header-button" mat-icon-button (click)="importScene()">
                        <mat-icon>file_upload</mat-icon>
                    </button>
                </div>
            </th>
            <th colspan="2">
                <div class="import-export">
                    scene export
                    <button class="header-button" mat-icon-button (click)="$event.stopPropagation();exportScene()">
                        <mat-icon>file_download</mat-icon>
                    </button>
                </div>
            </th>
        </tr>
        <tr>
            <th>&nbsp;</th>
            <th>r</th>
            <th>g</th>
            <th>b</th>
        </tr>
        <tr>
            <td>scene color</td>
            <td>
                <input 
                (input)="updateSceneColor(+redScene.value, +greenScene.value, +blueScene.value)" 
                #redScene 
                [value]="getColor('red', controlsService.sceneColor())" 
                type="number"
                min="0"
                max="255"
                ></td>
            <td>
                <input 
                (input)="updateSceneColor(+redScene.value, +greenScene.value, +blueScene.value)" 
                #greenScene 
                [value]="getColor('green', controlsService.sceneColor())" 
                type="number"
                min="0"
                max="255"
                >
            </td>
            <td>
                <input 
                (input)="updateSceneColor(+redScene.value, +greenScene.value, +blueScene.value)" 
                #blueScene 
                [value]="getColor('blue', controlsService.sceneColor())" 
                type="number"
                min="0"
                max="255"
                >
            </td>
        </tr>
        <tr>
            <td>ambient color</td>
            <td>
                <input 
                (input)="updateAmbientColor(+red.value, +green.value, +blue.value)" 
                #red 
                value="255" 
                type="number"
                min="0"
                max="255"
                ></td>
            <td>
                <input 
                (input)="updateAmbientColor(+red.value, +green.value, +blue.value)" 
                #green 
                value="255" 
                type="number"
                min="0"
                max="255"
                >
            </td>
            <td>
                <input 
                (input)="updateAmbientColor(+red.value, +green.value, +blue.value)" 
                #blue 
                value="255" 
                type="number"
                min="0"
                max="255"
                >
            </td>
        </tr>
        <tr>
            <td>intensity</td>
            <td colspan="3">
                <input 
                    (input)="updateAmbientIntensity(+$any($event.target).value)"
                    class="intensity" 
                    value="1" 
                    type="number"
                    step=".1"
                    min="0"
                >
            </td>
        </tr>
    </table>
</div>

<ng-template #toJson let-data>
  <mat-dialog-content class="json-content">
    <pre>{{data.json | json}}</pre>
  </mat-dialog-content>
</ng-template>

<ng-template #fromJson>
  <h2 mat-dialog-title>Import Scene</h2>

  <mat-dialog-content>
    <textarea
      class="import-text"
      #jsonData
      placeholder="Paste Three.js JSON here">
    </textarea>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-icon-button
      (click)="addSceneFromJson(jsonData)"
      aria-label="Import scene">
      <mat-icon>add</mat-icon>
    </button>

    <button
      mat-button
      mat-dialog-close>
      Cancel
    </button>
  </mat-dialog-actions>
</ng-template>
